name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish extension
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const metadata = JSON.parse(readFileSync('src/metadata.json', 'utf8'));
          const expectedTag = `v${metadata['version-name']}`;

          if (process.env.RELEASE_TAG !== expectedTag) {
            console.error(`Release tag must be ${expectedTag}, got ${process.env.RELEASE_TAG}`);
            process.exit(1);
          }
          NODE

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gnome-shell gettext libglib2.0-bin zip

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm run build

      - name: Check release package
        run: unzip -t dist/builds/*.shell-extension.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/builds/*.shell-extension.zip \
            --verify-tag \
            --title "Media Controls ${RELEASE_TAG#v}" \
            --generate-notes \
            "${release_args[@]}"
